name: Atualizar o feed todo dia

on:
  schedule:
    - cron: '0 10 * * *'   # 7h da manhã no horário de Brasília
  workflow_dispatch:        # permite rodar na mão pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Buscar artigos novos
        run: python buscar_artigos.py

      - name: Salvar os artigos no site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artigos.json
          git diff --staged --quiet || git commit -m "Feed atualizado em $(TZ='America/Sao_Paulo' date +'%d/%m/%Y às %H:%M')"
          git push
